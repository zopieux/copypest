[package]
name = "copypest"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = { version = "0.36", default-features = false }
x11rb = { version = "0.14", features = ["xfixes", "allow-unsafe-code"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
fuzzy-matcher = "0.3"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
bincode = "1.3"
libc = "0.2"
